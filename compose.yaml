services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      INFERENCE_DEVICE: ${INFERENCE_DEVICE:-cpu}
      ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-4}

      MAX_MEDIA_PIXELS: ${MAX_MEDIA_PIXELS:-48000000}
    volumes:
      - backend-data:/app/data
      - backend-storage:/app/storage
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3001}:3000"

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: floatwatch-sqlite-web
    restart: unless-stopped
    command:
      - app.db
      - --read-only
    volumes:
      - backend-data:/data:ro
    ports:
      - "0.0.0.0:8090:8080"

volumes:
  backend-data:
  backend-storage:
  
